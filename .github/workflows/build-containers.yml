name: build-containers
on:
  push:
    tags:
      - 'v*' # Trigger only on version tags (e.g., v1.0.0)

env:
    IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  push-ghcr:
    name: Build and push image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        containerfile:
          - udx-toolbox
          - playwright-toolbox
          - ubuntu-gui-toolbox
    steps:
      # Free up disk space on the runner before building.
      # GitHub's ubuntu-24.04 runner ships with ~14GB free out of ~30GB; the
      # rest is preinstalled SDKs (dotnet, android, ghc, hostedtoolcache) we
      # don't need for buildah. The udx-toolbox image (LibreOffice + 8 Electron
      # apps each bundling their own electron runtime) overflows that budget
      # at COMMIT/blob-copy time. Removing the unused preinstalls frees ~25GB.
      - name: Free disk space on runner
        run: |
          set -eux
          df -h /
          sudo rm -rf /usr/share/dotnet \
                      /usr/local/lib/android \
                      /opt/ghc \
                      /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/boost \
                      /usr/local/.ghcup
          sudo docker image prune --all --force || true
          df -h /

      # Clone code to runner
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)

      # Extract version from git tag
      - name: Extract version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Version: ${VERSION}"

      # Build metadata
      - name: Image Metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0 (Node 24)
        id: meta
        with:
          images: |
            ${{ matrix.containerfile }}
          labels: |
            io.artifacthub.package.readme-url=https://raw.githubusercontent.com/ublue-os/boxkit/main/README.md

      # Build image using Buildah action
      - name: Build Image
        id: build_image
        uses: redhat-actions/buildah-build@719e3c40d8af9790c23eca13f7daa339f2867034 # v3.1.0 (Node 24)
        with:
          containerfiles: |
            ./ContainerFiles/${{ matrix.containerfile }}
          image: ${{ matrix.containerfile }}
          tags: ${{ steps.version.outputs.version }} latest
          labels: ${{ steps.meta.outputs.labels }}
          oci: true
          
      # OCI registry names must be lowercase. Use Bash instead of a JavaScript
      # action so this normalization has no deprecated Node runtime dependency.
      - name: Lowercase Registry
        id: registry_case
        shell: bash
        run: echo "registry=${IMAGE_REGISTRY,,}" >> "$GITHUB_OUTPUT"

      # Push the image to GHCR (Image Registry)
      - name: Push To GHCR
        uses: redhat-actions/push-to-registry@94ade333c38ecc0e60e94785125d9a52ca423b37 # v3.0.0 (Node 24)
        if: github.event_name != 'pull_request'
        id: push
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ github.token }}
        with:
          image: ${{ steps.build_image.outputs.image }}
          tags: ${{ steps.build_image.outputs.tags }}
          registry: ${{ steps.registry_case.outputs.registry }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ env.REGISTRY_PASSWORD }}
            
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0 (Node 24)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
            
      # Sign container
      - name: Install cosign
        # v3.10.0 installs Cosign 2.x, whose legacy signature tag format is
        # required by Podman's signature-policy verification. Action is composite
        # and has no JavaScript/Node runtime.
        uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0 (composite)

      - name: Sign container image
        if: github.event_name != 'pull_request'
        run: |
          if [ -z "$COSIGN_PRIVATE_KEY" ]; then
            echo "SIGNING_SECRET not configured, skipping image signing"
            exit 0
          fi

          # Debug: print all push outputs
          echo "All push outputs:"
          echo "${{ toJSON(steps.push.outputs) }}"

          # Get the image reference from push outputs
          # The push action outputs the image with tag and digest
          # Format: ghcr.io/owner/image:tag@sha256:digest
          IMAGE_REF='${{ steps.push.outputs.registry-path }}'

          # If registry-path is empty, try to construct it manually
          if [ -z "${IMAGE_REF}" ]; then
            echo "registry-path is empty, constructing image reference manually"
            REGISTRY='${{ steps.registry_case.outputs.registry }}'
            IMAGE='${{ matrix.containerfile }}'
            TAG='${{ steps.version.outputs.version }}'
            DIGEST='${{ steps.push.outputs.digest }}'
            IMAGE_REF="${REGISTRY}/${IMAGE}:${TAG}@${DIGEST}"
          fi

          echo "Signing image: ${IMAGE_REF}"

          # Verify the image reference is not empty
          if [ -z "${IMAGE_REF}" ] || [ "${IMAGE_REF}" = "@" ]; then
            echo "ERROR: Could not construct image reference"
            exit 1
          fi

          # Debug: Check if COSIGN_PASSWORD is set
          if [ -z "$COSIGN_PASSWORD" ]; then
            echo "WARNING: COSIGN_PASSWORD is not set"
          else
            echo "COSIGN_PASSWORD is set (length: ${#COSIGN_PASSWORD})"
          fi

          # Sign the image
          cosign sign -y --key env://COSIGN_PRIVATE_KEY "${IMAGE_REF}"
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}

      - name: Echo outputs
        run: |
          echo "${{ toJSON(steps.push.outputs) }}"
