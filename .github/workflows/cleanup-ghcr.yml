name: cleanup-ghcr

# Retention policy:
#   - udx-toolbox, playwright-toolbox, ubuntu-gui-toolbox: keep the 3 most recent versions
#     (which includes the one tagged `latest`). Older versions are pruned.
#   - Decommissioned images (boxkit, browser-toolbox, data-toolbox,
#     notetaking-toolbox) are NOT pruned here — they are wiped entirely
#     out-of-band via scripts/decommission-ghcr.sh after the udx-toolbox
#     migration ships. Once wiped, this workflow no longer touches them.

on:
  schedule:
    - cron: "0 2 * * 0"  # Weekly on Sunday at 2 AM UTC
  workflow_dispatch:  # Allow manual trigger

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      # actions/delete-package-versions still targets deprecated Node 20.
      # Use github-script v9's Node 24 runtime and the Packages API directly.
      - name: Prune old toolbox versions (keep 3)
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0 (Node 24)
        with:
          script: |
            const packageNames = [
              "udx-toolbox",
              "playwright-toolbox",
              "ubuntu-gui-toolbox",
            ];
            const owner = context.repo.owner;
            const { data: account } = await github.rest.users.getByUsername({
              username: owner,
            });
            const organization = account.type === "Organization";
            const ownerKey = organization ? "org" : "username";
            const listVersions = organization
              ? github.rest.packages.getAllPackageVersionsForPackageOwnedByOrg
              : github.rest.packages.getAllPackageVersionsForPackageOwnedByUser;
            const deleteVersion = organization
              ? github.rest.packages.deletePackageVersionForOrg
              : github.rest.packages.deletePackageVersionForUser;

            for (const packageName of packageNames) {
              const ownerParams = { [ownerKey]: owner };
              const versions = await github.paginate(listVersions, {
                ...ownerParams,
                package_type: "container",
                package_name: packageName,
                per_page: 100,
              });
              versions.sort(
                (a, b) => new Date(b.created_at) - new Date(a.created_at),
              );

              core.info(
                `${packageName}: keeping ${Math.min(3, versions.length)} of ${versions.length} versions`,
              );
              for (const version of versions.slice(3)) {
                core.info(
                  `Deleting ${packageName} version ${version.id} (${version.name})`,
                );
                await deleteVersion({
                  ...ownerParams,
                  package_type: "container",
                  package_name: packageName,
                  package_version_id: version.id,
                });
              }
            }
