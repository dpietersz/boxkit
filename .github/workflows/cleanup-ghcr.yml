name: cleanup-ghcr

# Retention policy:
#   - udx-toolbox, playwright-toolbox, ubuntu-gui-toolbox: keep the 3 most recent versions
#     (which includes the one tagged `latest`). Older versions are pruned.
#   - Decommissioned images (boxkit, browser-toolbox, data-toolbox,
#     notetaking-toolbox) are NOT pruned here — they are wiped entirely
#     out-of-band via scripts/decommission-ghcr.sh after the udx-toolbox
#     migration ships. Once wiped, this workflow no longer touches them.

on:
  schedule:
    - cron: "0 2 * * 0"  # Weekly on Sunday at 2 AM UTC
  workflow_dispatch:  # Allow manual trigger
    inputs:
      dry_run:
        description: "Only log what would be deleted"
        type: boolean
        default: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)

      - name: Test retention logic
        run: node --test .github/scripts/ghcr-retention.test.cjs

      # Retention counts images, not raw package versions: each release also
      # pushes a cosign .sig version. See .github/scripts/ghcr-retention.cjs.
      # actions/delete-package-versions still targets deprecated Node 20, so
      # use github-script v9's Node 24 runtime and the Packages API directly.
      - name: Prune old toolbox images (keep 3)
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0 (Node 24)
        with:
          script: |
            const packageNames = [
              "udx-toolbox",
              "playwright-toolbox",
              "ubuntu-gui-toolbox",
            ];
            const { prune } = require(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/ghcr-retention.cjs`,
            );
            await prune({
              github,
              context,
              core,
              packageNames,
              keep: 3,
              dryRun: context.payload.inputs?.dry_run === "true" ||
                context.payload.inputs?.dry_run === true,
            });
