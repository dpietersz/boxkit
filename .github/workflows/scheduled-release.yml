name: scheduled-release

on:
  schedule:
    - cron: '0 10 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  scheduled-release:
    name: Create weekly package update
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with:
          # Use PAT, not GITHUB_TOKEN: pushes made with GITHUB_TOKEN do not
          # trigger release-please/build workflows, so weekly images never rebuild.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create weekly update commit
        run: |
          echo "# Updated $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> .github/.updated
          git add .github/.updated
          git commit -m "chore: weekly package update"

      - name: Push to main
        run: |
          git push origin main

      - name: Wait for and merge release PR
        run: |
          PR=""
          for attempt in {1..20}; do
            PR=$(gh pr list \
              --head release-please--branches--main \
              --state open \
              --json number \
              --jq '.[0].number')

            if [ -n "$PR" ]; then
              echo "Found release PR #$PR on attempt $attempt"
              break
            fi

            echo "No release PR yet (attempt $attempt/20); waiting..."
            sleep 15
          done

          if [ -z "$PR" ]; then
            echo "ERROR: release-please did not create a release PR."
            echo "Weekly package update commit was pushed, but no image build will happen without a release tag."
            exit 1
          fi

          gh pr merge "$PR" --squash --delete-branch
        env:
          # Same PAT used for the scheduled commit so merge-triggered workflows run too.
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
